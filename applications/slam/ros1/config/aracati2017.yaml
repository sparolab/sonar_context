# Aracati 2017 (BlueView P900-130: 130 deg, 50 m), fan images on /son, DISO poses on /direct_sonar/pose.
image_topic: /son
image_transport: compressed
image_layout: fan          # Cartesian fan, apex at the bottom center
pose_topic: /direct_sonar/pose
pose_type: pose
flip_frame: true         # DISO poses are z-down: flip them (and the beams) to z-up
fov_deg: 130.0
max_range: 50.0
range_bins: 750            # polar image resampled from the fan
beams: 300
# Sonar Context: drop the near field (75 bins = 5 m), patches of 25 range bins (1.7 m) x 4 beams
skip_range: 75
patch_range: 25
patch_beam: 4
col_threshold: 0.2
row_threshold: 0.0         # off: accept by the column distance only
exclude_recent: 30
num_candidates: 1
keyframe_distance: 1.0
keyframe_yaw_deg: 15.0
# loop verification: dense phase correlation of the two frames (normalized peak)
min_range: 8.0           # map points: strongest returns beyond 8 m
keep_percentile: 99.5
min_peak: 0.10
odom_sigma_xy: 0.05
loop_sigma_xy: 0.3
