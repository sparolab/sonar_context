[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-context"
dynamic = ["version"]
description = "Sonar Context: imaging-sonar place recognition and loop closing (ICRA 2023)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Hogyun Kim", email = "hg.kim@inha.edu" }]
keywords = ["sonar", "imaging sonar", "forward-looking sonar", "underwater", "place recognition", "loop closure",
            "slam", "global descriptor", "multi-session", "multi-robot", "robotics", "aracati"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy", "scipy", "pillow"]

[project.optional-dependencies]
progress = ["tqdm"]

[project.scripts]
sonar-context = "sonar_context.cli:main"

[project.urls]
Homepage = "https://github.com/sparolab/sonar_context"
Paper = "https://ieeexplore.ieee.org/document/10161518"
Issues = "https://github.com/sparolab/sonar_context/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["sonar_context"]

[tool.setuptools.dynamic]
version = { attr = "sonar_context.__version__" }
