name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the C++ library (parity test)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install eigen; else sudo apt-get update && sudo apt-get install -y libeigen3-dev; fi
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build -j
          ctest --test-dir cpp/build --output-on-failure
      - run: pip install . pytest
      - run: sonar-context --version && pytest -q python/tests
